<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>《星骸回响》体态轮换总选稿 · 2026-08-15</title>
<style>
  body { background:#f7f7f9; color:#222; font-family:"Microsoft YaHei", sans-serif; margin:0; padding:24px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:#666; font-size:13px; margin-bottom:8px; }
  .note { background:#fff8ef; border:1px solid #f0d9b8; border-radius:8px; padding:10px 14px; font-size:13px; color:#6b5428; margin:14px 0; }
  .sec { background:#fff; border:1px solid #e3e3e8; border-radius:10px; padding:16px; margin:18px 0; }
  .sec h2 { font-size:17px; margin:0 0 10px; }
  .group { margin-bottom:16px; }
  .group .gname { font-size:13px; font-weight:bold; color:#555; margin-bottom:8px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .var { border:1px solid #e9e9ee; border-radius:8px; padding:6px; background:#fcfcfd; text-align:center; }
  .var .vname { font-size:11px; font-weight:bold; margin-bottom:4px; }
  .var img { height:170px; background:repeating-conic-gradient(#f0f0f2 0 25%, #fff 0 50%) 0 0/16px 16px; border-radius:4px; border:1px solid #eee; }
  .var .pimg { height:230px; }
  .var .bad { outline:2px solid #e0563c; }
</style>
</head>
<body>
<h1>《星骸回响》体态轮换 · 全版本总选稿（局内 + 立绘）</h1>
<div class="sub">2026-08-15 · 女角色 3 体态（巨乳御姐/少女/萝莉）× 每组合 局内 5 版 + 立绘 2 版 · 莱恩 局内 8 版 + 立绘 2 版 · 全部纯白底生成</div>
<div class="note">局内模型：v7 的 s1/s2 + v8 的 s3~s5 共 5 版。立绘为 Neta 白底全身（红框 = 背景抽检不达标，可弃）。点击看原图。</div>

<div id="content"></div>
<script>
let MAPS = null;
fetch("_v78_maps.json").then(r=>r.json()).then(m=>{
  MAPS = m;
  render();
}).catch(()=>{ document.getElementById("content").innerHTML = "映射文件加载失败"; });

const BODY_ZH = { mature:"巨乳御姐", youth:"少女", loli:"萝莉" };
const GIRLS = ["elin","noah","siia"];
const GIRL_ZH = { elin:"艾琳 · 炎术师", noah:"诺亚 · 魔导技师", siia:"希亚 · 医师" };

function imgVar(sub, mapKey, name, dir, label, cls="") {
  const f = MAPS[mapKey][name];
  if (!f) return "";
  return `<div class="var"><div class="vname">${label}</div><a href="${dir}/${f}" target="_blank"><img class="${cls}" src="${dir}/${f}"></a></div>`;
}

function render() {
  const content = document.getElementById("content");
  let html = "";
  for (const hid of GIRLS) {
    html += `<div class="sec"><h2>${hid.toUpperCase()} · ${GIRL_ZH[hid]}</h2>`;
    for (const [bkey, bzh] of Object.entries(BODY_ZH)) {
      html += `<div class="group"><div class="gname">${bzh}</div><div class="row">`;
      for (let k = 1; k <= 5; k++) {
        html += imgVar(null, "models_v7", `${hid}_${bkey}_s${k}`, "v7_bodys_20260815/models", `局内 s${k}`);
        html += imgVar(null, "models_v8", `${hid}_${bkey}_s${k}`, "v8_all_20260815/models", `局内 s${k}`);
      }
      for (let k = 1; k <= 2; k++) {
        const pn = `${hid}_${bkey}_p${k}`;
        const bad = (hid==="elin" && bkey==="mature" && k===1) || (hid==="elin" && bkey==="loli" && k===2) || (hid==="noah" && bkey==="mature" && k===1) || (hid==="noah" && bkey==="youth" && k===1) || (hid==="siia" && bkey==="loli" && k===1);
        html += imgVar(null, "portraits_v8", pn, "v8_all_20260815/portraits", `立绘 p${k}${bad?" ⚠":""}`, bad ? "pimg bad" : "pimg");
      }
      html += `</div></div>`;
    }
    html += "</div>";
  }
  // 莱恩
  html += `<div class="sec"><h2>LAIN · 莱恩 · 剑士</h2><div class="group"><div class="row">`;
  for (let k = 1; k <= 8; k++) {
    html += imgVar(null, "models_v7", `lain_s${k}`, "v7_bodys_20260815/models", `局内 s${k}`);
    html += imgVar(null, "models_v8", `lain_s${k}`, "v8_all_20260815/models", `局内 s${k}`);
  }
  for (let k = 1; k <= 2; k++) {
    html += imgVar(null, "portraits_v8", `lain_p${k}`, "v8_all_20260815/portraits", `立绘 p${k}`, "pimg");
  }
  html += `</div></div></div>`;
  content.innerHTML = html;
}
</script>
</body>
</html>
